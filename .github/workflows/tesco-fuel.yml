name: Fetch Daily Tesco Fuel Price

on:
  schedule:
    - cron: '0 5 * * *' # 5:00 AM UTC every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fuel-price:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Yesterday's Tesco Baguley Diesel
        run: |
          python3 <<'PY'
          import csv
          import io
          import json
          import urllib.request
          import urllib.parse
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          # ============================================================
          # SETTINGS
          # ============================================================

          # Tesco Extra Baguley Postcode
          TARGET_POSTCODE = "M23 9TJ"

          # Fuel Finder standard diesel
          DIESEL_FIELD = "forecourts.fuel_price.B7S"

          # Fuel Finder archive
          REPO = "matthewgall/fuelfinder-archive"
          FILE_PATH = "data.csv"

          # ============================================================
          # HELPERS
          # ============================================================

          def fetch_url(url, headers=None):
              """
              Download a URL and return its contents as text.
              """
              request = urllib.request.Request(
                  url,
                  headers=headers or {
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "*/*"
                  }
              )

              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read().decode("utf-8-sig")


          def get_yesterday_uk():
              """
              Work out yesterday using UK time rather than UTC.
              """
              uk_now = datetime.now(ZoneInfo("Europe/London"))
              yesterday = uk_now.date() - timedelta(days=1)
              return yesterday


          def get_archive_commit_for_date(target_date):
              """
              Ask GitHub for the latest commit to data.csv that existed
              on or before the end of yesterday.
              """

              until_dt = datetime(
                  target_date.year,
                  target_date.month,
                  target_date.day,
                  23,
                  59,
                  59,
                  tzinfo=timezone.utc
              )

              params = urllib.parse.urlencode({
                  "path": FILE_PATH,
                  "until": until_dt.isoformat().replace("+00:00", "Z"),
                  "per_page": "1"
              })

              url = (
                  f"https://api.github.com/repos/{REPO}/commits?"
                  f"{params}"
              )

              text = fetch_url(
                  url,
                  {
                      "User-Agent": "Turbo-Transit-Logistics-Fuel-Tracker",
                      "Accept": "application/vnd.github+json"
                  }
              )

              commits = json.loads(text)

              if not commits:
                  raise RuntimeError(
                      f"No archive commit found for {target_date}"
                  )

              return commits[0]


          def parse_float(value):
              try:
                  if value is None:
                      return None

                  value = str(value).strip()

                  if not value:
                      return None

                  return float(value)

              except Exception:
                  return None


          # ============================================================
          # DETERMINE YESTERDAY
          # ============================================================

          yesterday = get_yesterday_uk()

          print(f"Target station: Tesco Extra Baguley ({TARGET_POSTCODE})")
          print(f"Looking for price from: {yesterday}")


          # ============================================================
          # FIND THE HISTORICAL ARCHIVE VERSION
          # ============================================================

          print("")
          print("Finding archived Fuel Finder dataset...")

          commit = get_archive_commit_for_date(yesterday)

          commit_sha = commit["sha"]
          commit_date = commit["commit"]["committer"]["date"]

          print(f"Archive commit: {commit_sha}")
          print(f"Archive timestamp: {commit_date}")


          # ============================================================
          # DOWNLOAD THAT HISTORICAL CSV
          # ============================================================

          raw_url = (
              f"https://raw.githubusercontent.com/"
              f"{REPO}/{commit_sha}/{FILE_PATH}"
          )

          print("")
          print("Downloading historical dataset...")

          csv_text = fetch_url(
              raw_url,
              {
                  "User-Agent": "Turbo-Transit-Logistics-Fuel-Tracker",
                  "Accept": "text/csv,*/*"
              }
          )

          print(f"Downloaded {len(csv_text):,} characters")


          # ============================================================
          # READ CSV
          # ============================================================

          reader = csv.DictReader(io.StringIO(csv_text))

          if not reader.fieldnames:
              raise RuntimeError("CSV has no header row")

          # ============================================================
          # FIND TESCO BAGULEY SPECIFICALLY
          # ============================================================

          baguley_price = None
          station_name = "Tesco Extra Baguley"

          for row in reader:
              postcode = row.get("forecourts.location.postcode", "").strip().upper()

              # Compare postcodes ignoring internal spaces (M23 9TJ vs M239TJ)
              if postcode.replace(" ", "") == TARGET_POSTCODE.replace(" ", ""):
                  diesel = parse_float(row.get(DIESEL_FIELD))
                  if diesel is not None:
                      if diesel < 10:
                          diesel *= 100
                      baguley_price = round(diesel, 1)
                      station_name = (
                          row.get("forecourts.trading_name", "")
                          or row.get("forecourts.name", "")
                          or station_name
                      ).strip()
                      break


          # ============================================================
          # SAFETY CHECK
          # ============================================================

          if baguley_price is None:
              raise RuntimeError(
                  f"Could not find a valid diesel price for Tesco Baguley ({TARGET_POSTCODE})."
              )


          # ============================================================
          # DISPLAY RESULTS
          # ============================================================

          print("")
          print("=" * 70)
          print("TESCO BAGULEY DIESEL RESULT")
          print("=" * 70)
          print(f"Station: {station_name}")
          print(f"Postcode: {TARGET_POSTCODE}")
          print(f"Diesel Price: {baguley_price}p")
          print("=" * 70)


          # ============================================================
          # WRITE RESULT
          # ============================================================

          output = {
              "date": yesterday.isoformat(),
              "target_postcode": TARGET_POSTCODE,
              "station_name": station_name,
              "fuel": "B7S",
              "fuel_description": "Standard diesel",
              "tesco_diesel_average_pence": baguley_price,
              "archive_commit": commit_sha,
              "archive_timestamp": commit_date
          }

          with open(
              "prices.json",
              "w",
              encoding="utf-8"
          ) as out:
              json.dump(
                  output,
                  out,
                  indent=2
              )

          print("")
          print("prices.json created successfully.")
          print(f"Saved Baguley price: {baguley_price}p")

          PY

      - name: Commit and Push Updated Price
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add prices.json

          git commit -m "Update yesterday's Tesco Baguley diesel price" || exit 0

          git push
